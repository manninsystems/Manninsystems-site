<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brackwater Extrusions | Production system</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E0A21B'/%3E%3Cpath fill='%2317202A' fill-rule='evenodd' d='M6 9h20v14H6z M9 12v8h6v-8z M17 12v8h6v-8z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F3; --sheet:#FBFCFC; --sunk:#E8EDEC; --ink:#1B2430; --ink2:#3A4754; --steel:#5A6A76; --faint:#8995A0;
  --rule:#D2D9DC; --rule2:#E3E8EA;
  --sea:#1F5F6B; --sea-tint:#DCEAEB; --sea-deep:#164852;
  --gorse:#E0A21B; --gorse-ink:#8A6200; --gorse-tint:#FAEFD3;
  --brick:#B04832; --brick-tint:#F5E0DA;
  --rail:#17202A; --rail2:#1F2A36; --rail-fg:#D5DDE2; --rail-dim:#8494A0;
  --lift:0 1px 0 rgba(27,36,48,.03), 0 18px 36px -26px rgba(27,36,48,.35);
  --lw:128px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161C; --sheet:#151D25; --sunk:#1B252F; --ink:#E4EAED; --ink2:#C2CCD2; --steel:#97A5AF; --faint:#6D7B86;
    --rule:#29343F; --rule2:#212B35; --sea:#6DB2BE; --sea-tint:#16303A; --sea-deep:#8FC6CF;
    --gorse:#F0B43A; --gorse-ink:#F0B43A; --gorse-tint:#3A2E12; --brick:#E27B63; --brick-tint:#3A1E18;
    --rail:#0B1016; --rail2:#141C24; --rail-fg:#D5DDE2; --rail-dim:#7B8A96;
    --lift:0 1px 0 rgba(0,0,0,.25), 0 18px 36px -26px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#10161C; --sheet:#151D25; --sunk:#1B252F; --ink:#E4EAED; --ink2:#C2CCD2; --steel:#97A5AF; --faint:#6D7B86;
  --rule:#29343F; --rule2:#212B35; --sea:#6DB2BE; --sea-tint:#16303A; --sea-deep:#8FC6CF;
  --gorse:#F0B43A; --gorse-ink:#F0B43A; --gorse-tint:#3A2E12; --brick:#E27B63; --brick-tint:#3A1E18;
  --rail:#0B1016; --rail2:#141C24; --lift:0 1px 0 rgba(0,0,0,.25), 0 18px 36px -26px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--sea);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:.18em}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:3px}
button,input,select{font:inherit;color:inherit}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font-weight:760;font-stretch:116%;font-size:15px;letter-spacing:-.01em;color:#fff;line-height:1.15}
.brand span{display:block;font-size:12px;color:var(--rail-dim);font-stretch:95%}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;color:var(--rail-fg);font-weight:540;font-size:14px;text-decoration:none}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav a:hover{background:var(--rail2)}
.nav a[aria-current="page"]{background:var(--rail2);color:#fff;box-shadow:inset 3px 0 0 var(--gorse)}
.nav a[aria-current="page"] svg{opacity:1}
.nav .count{margin-left:auto;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:inline-grid;place-items:center;
  background:var(--gorse);color:#1B2430;font-size:11.5px;font-weight:760;border:1.4px solid #1B2430}
.rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--rail2);font-size:12px;color:var(--rail-dim);line-height:1.45}
.rail-foot strong{color:var(--rail-fg);font-weight:600;display:block}
.rail-foot a{color:var(--rail-fg)}

.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:calc(14px + env(safe-area-inset-top,0px)) 32px 14px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.clock{display:flex;flex-direction:column;line-height:1.2}
.clock b{font-weight:700;font-stretch:108%;font-size:14px}
.clock span{font-size:12px;color:var(--steel)}
.search{margin-left:auto;position:relative;width:min(360px,46vw)}
.search input{width:100%;height:36px;border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:0 12px 0 34px;font-size:13.5px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;stroke:var(--steel);fill:none;stroke-width:1.7}
.search-msg{position:absolute;top:40px;left:0;right:0;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--steel);box-shadow:var(--lift)}
.page{padding:26px 32px 72px;max-width:1480px}
.crumbs{font-size:12.5px;color:var(--steel);margin-bottom:6px}
.crumbs a{color:var(--steel)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:22px}
h1{margin:0;font-size:clamp(24px,2.3vw,31px);font-weight:770;font-stretch:118%;letter-spacing:-.02em;line-height:1.08}
.sub{margin:6px 0 0;color:var(--steel);font-size:14px;max-width:70ch}
h2{margin:0;font-size:15px;font-weight:720;font-stretch:108%;letter-spacing:-.005em}

/* ---------- panels & grids ---------- */
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1180px){.g-2,.g-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g-2e{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--rule2)}
.ph .aside{font-size:12.5px;color:var(--steel)}
.pb{padding:16px 18px}
.stack>*+*{margin-top:18px}
.muted{color:var(--steel)}
.small{font-size:12.5px}
.wide{font-stretch:116%;font-weight:760;letter-spacing:-.01em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- status marks ---------- */
.st{display:inline-flex;align-items:center;gap:7px;font-weight:620;font-size:12.5px;white-space:nowrap;color:var(--ink2)}
.st i{width:10px;height:6px;border-radius:1px;background:currentColor;flex:none}
.st.complete{color:var(--steel)}
.st.running{color:var(--sea)}
.st.running i{animation:pulse 2s ease-in-out infinite}
.st.released{color:var(--sea)} .st.released i{background:transparent;border:1.5px solid currentColor}
.st.planned{color:var(--ink2)} .st.planned i{background:transparent;border:1.5px dashed currentColor}
.st.cancelled{color:var(--faint)} .st.cancelled span{text-decoration:line-through}
.st.late{color:var(--brick)}
.st.part{color:var(--gorse-ink)}
.st.open{color:var(--ink2)} .st.open i{background:transparent;border:1.5px solid currentColor}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.st.running i,.now-dot{animation:none!important}}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--steel);padding:9px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--sheet)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;white-space:nowrap}
.tbl tr.go{cursor:pointer}
.tbl tr.go:hover td{background:var(--sunk)}
.tbl td.id a{font-weight:680;color:var(--ink)}
.tbl td .two{display:block;font-size:12px;color:var(--steel);font-stretch:94%}
.tbl.dense td{padding:7px 14px}
.tbl.nw td{white-space:nowrap}
.tbl.nw td.wrap{white-space:normal;min-width:240px}
.tbl td a{white-space:nowrap}
.code{font-weight:640;letter-spacing:.005em}
.neg{color:var(--ink2)} .pos{color:var(--sea)}
.struck{text-decoration:line-through;color:var(--faint)}
.chip{display:inline-block;font-size:11.5px;font-weight:620;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip.warn{background:var(--gorse-tint);color:var(--gorse-ink)}
.chip.bad{background:var(--brick-tint);color:var(--brick)}
.chip.sea{background:var(--sea-tint);color:var(--sea-deep)}

.bar{height:5px;border-radius:3px;background:var(--rule2);overflow:hidden;min-width:60px}
.bar>b{display:block;height:100%;background:var(--sea);border-radius:3px}
.bar.warn>b{background:var(--gorse)} .bar.bad>b{background:var(--brick)} .bar.done>b{background:var(--steel)}
.prog{display:grid;grid-template-columns:minmax(70px,1fr) auto;align-items:center;gap:10px}
.prog span{font-size:12px;color:var(--steel);white-space:nowrap}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg a,.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:580;color:var(--ink2);cursor:pointer;text-decoration:none;white-space:nowrap}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .n{color:var(--steel);font-weight:500;margin-left:4px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools select,.tools input{height:34px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:0 10px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--steel)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- overview: lines now ---------- */
.lines-now{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.lines-now{grid-template-columns:minmax(0,1fr)}}
.line-now{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 18px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.line-now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sea)}
.ln-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ln-top .ln{font-size:12.5px;font-weight:650;color:var(--steel)}
.ln-job{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ln-job a.jn{font-size:30px;line-height:1;font-weight:790;font-stretch:122%;color:var(--ink);letter-spacing:-.02em}
.ln-job .what{font-size:14.5px;font-weight:600}
.ln-job .who{font-size:13px;color:var(--steel)}
.ln-meter{margin:16px 0 12px}
.ln-meter .bar{height:10px;border-radius:5px}
.ln-meter .bar>b{border-radius:5px;background:linear-gradient(90deg,var(--sea) 0,var(--sea) 100%)}
.ln-figs{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:12.5px;color:var(--steel);margin-top:7px}
.ln-figs span{white-space:nowrap}
.ln-figs b{color:var(--ink);font-weight:700;font-size:14px}
.ln-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule2);margin-top:auto;padding-top:12px;gap:8px}
.ln-meter{margin-bottom:18px!important}
@media (max-width:560px){.ln-facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact small{display:block;font-size:11.5px;color:var(--steel)}
.fact b{font-weight:650;font-size:13.5px}

/* ---------- attention ---------- */
.att{list-style:none;margin:0;padding:0}
.att li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:13px 18px;border-bottom:1px solid var(--rule2);align-items:start}
.att li:last-child{border-bottom:0}
.att .mk{width:10px;height:6px;border-radius:1px;margin-top:7px}
.att .mk.bad{background:var(--brick)} .att .mk.warn{background:var(--gorse)}
.att b{display:block;font-weight:680;font-size:13.5px}
.att p{margin:2px 0 0;font-size:12.5px;color:var(--steel);line-height:1.45}
.att .fig{font-weight:720;font-size:13.5px;white-space:nowrap;text-align:right}
.att .fig.bad{color:var(--brick)} .att .fig.warn{color:var(--gorse-ink)}
.att a.row{grid-column:1/-1;display:contents;color:inherit}

/* ---------- line board (signature) ---------- */
.board-wrap{overflow-x:auto}
.board{position:relative;min-width:980px}
.bd-row{display:grid;grid-template-columns:var(--lw) repeat(10,minmax(0,1fr))}
.bd-head{border-bottom:1px solid var(--rule)}
.bd-head div{padding:10px 8px 8px;font-size:12px;color:var(--steel);border-left:1px solid var(--rule2)}
.bd-head div b{display:block;color:var(--ink);font-weight:720;font-stretch:112%;font-size:13px}
.bd-head div.today b{color:var(--gorse-ink)}
.bd-head div:first-child{border-left:0}
.bd-head div.wk{border-left:1px solid var(--rule)}
.bd-line{border-bottom:1px solid var(--rule2);min-height:84px}
.bd-line:last-child{border-bottom:0}
.bd-lab{padding:14px 14px 12px 18px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--rule2)}
.bd-lab b{font-weight:740;font-stretch:112%;font-size:14px}
.bd-lab span{font-size:12px;color:var(--steel)}
.bd-cell{border-left:1px solid var(--rule2);padding:8px 5px;display:flex}
.bd-cell.wk{border-left:1px solid var(--rule)}
.bd-cell.past{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--rule2) 55%,transparent) 7px 8px)}
.jb{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0;padding:8px 9px 9px;border-radius:6px;
  background:var(--sunk);border:1px solid var(--rule);color:var(--ink);text-decoration:none;position:relative;overflow:hidden;font-size:12px;line-height:1.25}
.jb:hover{text-decoration:none;border-color:var(--steel)}
.jb .n{font-weight:790;font-stretch:120%;font-size:15px;letter-spacing:-.01em}
.jb .p{color:var(--steel);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jb .q{font-weight:600;color:var(--ink2)}
.jb.complete{background:var(--sunk)}
.jb.complete .n{color:var(--ink2)}
.jb.running{background:var(--sea-tint);border-color:var(--sea)}
.jb.running .fill{position:absolute;left:0;bottom:0;height:4px;background:var(--sea)}
.jb.released{background:var(--sheet);border-color:var(--sea)}
.jb.planned{background:var(--sheet);border-style:dashed;border-color:var(--steel)}
.jb.cancelled{background:transparent;border-style:dashed;border-color:var(--rule);opacity:.6}
.jb.cancelled .n{text-decoration:line-through}
.jb .flag{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--gorse);border:1.3px solid var(--ink)}
.jb .flag.bad{background:var(--brick)}
.now{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--gorse);pointer-events:none;z-index:2}
.now-dot{position:absolute;top:-5px;left:-6px;width:10px;height:10px;border-radius:50%;background:var(--gorse);border:1.5px solid var(--ink);animation:pulse 2.4s ease-in-out infinite}
.now-tag{position:absolute;bottom:6px;left:6px;font-size:11px;font-weight:700;color:var(--gorse-ink);background:var(--sheet);padding:1px 5px;border-radius:3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--steel)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:9px;border-radius:2px;border:1px solid var(--rule);background:var(--sunk)}
.legend i.r{background:var(--sea-tint);border-color:var(--sea)} .legend i.p{background:var(--sheet);border:1px dashed var(--steel)} .legend i.rl{background:var(--sheet);border-color:var(--sea)}

/* ---------- week strip (title-block style) ---------- */
.tb{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.tb>div{padding:12px 16px 14px;border-left:1px solid var(--rule)}
.tb>div:first-child{border-left:0}
.tb small{display:block;font-size:12px;color:var(--steel)}
.tb b{display:block;font-size:22px;font-weight:760;font-stretch:112%;letter-spacing:-.01em;margin-top:2px}
.tb em{font-style:normal;font-size:12px;color:var(--steel)}
.tb em.up{color:var(--sea)} .tb em.down{color:var(--brick)}
@media (max-width:980px){.tb{grid-template-columns:repeat(2,minmax(0,1fr))}.tb>div{border-top:1px solid var(--rule)}.tb>div:nth-child(-n+2){border-top:0}.tb>div:nth-child(odd){border-left:0}}

/* ---------- job sheet title block ---------- */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;position:relative;box-shadow:var(--lift)}
.sheet::before{content:"";position:absolute;inset:6px;border:1px solid var(--rule2);border-radius:6px;pointer-events:none}
.tblock{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:6px;border-top:1px solid var(--rule2)}
.tblock>div{padding:10px 14px;border-bottom:1px solid var(--rule2)}
.tblock>div:nth-child(odd){border-right:1px solid var(--rule2)}
.tblock>div.full{grid-column:1/-1;border-right:0}
.tblock small{display:block;font-size:11.5px;color:var(--steel)}
.tblock b{font-weight:660;font-size:13.5px}
.sheet-title{padding:18px 20px 12px;position:relative}
.sheet-title .big{font-size:40px;line-height:1;font-weight:800;font-stretch:125%;letter-spacing:-.025em}
.figs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--rule2);margin:0 6px 6px;position:relative}
.figs>div{padding:12px 16px;border-left:1px solid var(--rule2)}
.figs>div:first-child{border-left:0}
.figs small{display:block;font-size:12px;color:var(--steel)}
.figs b{display:block;font-size:19px;font-weight:740;font-stretch:110%;margin-top:1px}
@media (max-width:760px){.figs{grid-template-columns:repeat(3,minmax(0,1fr))}.figs>div:nth-child(4){border-left:0}.figs>div:nth-child(n+4){border-top:1px solid var(--rule2)}}
.timeline{list-style:none;margin:0;padding:6px 0}
.timeline li{display:grid;grid-template-columns:92px 14px minmax(0,1fr) auto;gap:10px;padding:7px 18px;font-size:13px;align-items:baseline}
.timeline .t{color:var(--steel);font-size:12px;white-space:nowrap}
.timeline .dot{width:8px;height:8px;border-radius:50%;background:var(--rule);border:1.5px solid var(--steel);align-self:center}
.timeline .dot.issue{background:var(--sheet)} .timeline .dot.output{background:var(--sea);border-color:var(--sea)}
.timeline .dot.scrap{background:var(--brick);border-color:var(--brick)} .timeline .dot.die{background:var(--gorse);border-color:var(--ink)}
.timeline .dot.reversal{background:var(--sheet);border-style:dashed}
.late{font-size:11.5px;color:var(--gorse-ink);font-weight:600;margin-left:6px}
.note{background:var(--gorse-tint);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink)}
.note.plain{background:var(--sunk)}

/* ---------- trace ---------- */
.tree{list-style:none;margin:0;padding:0 0 0 2px}
.tree .tree{padding-left:22px;margin-left:9px}
.tree .tree>li::after{content:"";position:absolute;left:-22px;top:0;bottom:0;border-left:1px solid var(--rule)}
.tree .tree>li:last-child::after{bottom:auto;height:19px}
.tree li{position:relative;padding:6px 0 6px 0}
.tree .tree>li::before{content:"";position:absolute;left:-22px;top:19px;width:16px;border-top:1px solid var(--rule)}
.node{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);max-width:100%}
.node.root{border-color:var(--sea);background:var(--sea-tint)}
.node .lc{font-weight:720}
.node .it{color:var(--steel);font-size:12.5px}
.node .q{font-weight:640;font-size:12.5px}
.node .via{font-size:12px;color:var(--steel)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--steel)}
.kv dd{margin:0;font-weight:560}

details.grp{border-bottom:1px solid var(--rule2)}
details.grp:last-child{border-bottom:0}
details.grp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,2.2fr) 130px minmax(0,1.2fr) 20px;gap:12px;align-items:center;padding:11px 18px;font-size:13.5px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .num{text-align:right;padding-right:24px}
details.grp summary:hover{background:var(--sunk)}
details.grp summary .chev{width:14px;height:14px;stroke:var(--steel);fill:none;stroke-width:2;transition:transform .15s}
details.grp[open] summary .chev{transform:rotate(90deg)}
details.grp .inner{padding:2px 18px 14px 34px}
.kind-h{padding:14px 18px 6px;font-size:12.5px;font-weight:650;color:var(--steel);background:var(--sheet);border-bottom:1px solid var(--rule2)}

.meter{display:flex;gap:1px;align-items:flex-end;height:14px;width:170px}
.meter i.gap{margin-left:4px;box-shadow:-3px 0 0 -1px var(--gorse)}
.meter i{flex:1;height:100%;background:var(--rule2);border-radius:1px}
.meter i.on{background:var(--sea)} .meter i.on.warn{background:var(--gorse)} .meter i.on.bad{background:var(--brick)}
.empty{padding:28px 18px;text-align:left;color:var(--steel);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--rule2);background:none;color:var(--sea);font-weight:620;cursor:pointer;border-radius:0 0 10px 10px}
.more:hover{background:var(--sunk)}

/* ---------- small screens ---------- */
@media (max-width:760px){.legend{display:none}.figs b{font-size:16px}.sheet-title .big{font-size:32px}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:10;height:auto;flex-direction:row;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;overflow-x:auto}
  .brand{padding:0 8px 0 2px}
  .brand span,.rail-foot{display:none}
  .brand b{font-size:14px}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:7px 10px;white-space:nowrap;font-size:13px}
  .nav a svg{display:none}
  .nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--gorse)}
  .top{position:static;padding:12px 16px}
  .page{padding:18px 16px 56px}
  .search{width:auto;flex:1}
}
@media print{.rail,.top,.no-print{display:none!important}.app{display:block}.page{padding:0}body{background:#fff}}

</style>

<script>
(function () {
"use strict";
// ---------- data layer (swap loadData() for Supabase queries when hosted) ----------
const D = JSON.parse(document.getElementById("mrp-data").textContent);
const NOW = new Date(D.now);
const TZ = "Europe/London";
const I = D.items, LOTS = D.lots, DIES = D.dies, REC = D.recipes;
const LOC = Object.fromEntries(D.locations.map(l => [l.code, l]));
const LOCS = { STORES: "stores", REGRIND: "regrind bay", LINE1: "line 1", LINE2: "line 2", FG: "finished goods", QUAR: "quarantine" };
const LOCN = { STORES: "Stores", REGRIND: "Regrind bay", LINE1: "Line 1", LINE2: "Line 2", FG: "Finished goods", QUAR: "Quarantine" };
const J = Object.fromEntries(D.jobs.map(j => [j.no, j]));
const MV = new Map(D.mv.map(m => [m.id, m]));
const reversedBy = {};
D.mv.forEach(m => { if (m.t === "reversal") reversedBy[m.rev] = m.id; });
D.mv.forEach(m => { m.eff = m.t === "reversal" ? MV.get(m.rev).t : m.t; });

// ---------- formatting ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n0 = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 0 });
const n1 = new Intl.NumberFormat("en-GB", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const q = (v, uom) => uom === "kg" ? n1.format(v) + " kg" : n0.format(v) + " " + uom;
const qi = (v, item) => q(v, I[item].uom);
const dayKey = d => new Date(d).toLocaleDateString("en-CA", { timeZone: TZ });
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fDay = d => { const k = d.length === 10 ? d : dayKey(d); const x = new Date(k + "T12:00:00Z"); return `${WD[x.getUTCDay()]} ${x.getUTCDate()} ${MO[x.getUTCMonth()]}`; };
const fDayLong = d => new Date(d).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: TZ });
const fTime = d => new Date(d).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: TZ });
const fWhen = d => fDay(d) + ", " + fTime(d);
const TODAY = dayKey(NOW);
const short = code => I[code].name.split(",")[0];
const tiny = code => short(code).replace(/\s+\d.*$/, "").replace(/ profile$| base$/, "");
const pct = v => v == null ? "–" : n1.format(v) + "%";
const addDays = (key, n) => { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const wd = key => new Date(key + "T12:00:00Z").getUTCDay();
const lineName = c => c === "LINE1" ? "Line 1" : "Line 2";
const custOf = so => so ? D.orders.find(o => o.no === so[0]).customer : null;

// ---------- derived views (mirror the database views) ----------
const bal = {};
D.mv.forEach(m => { const k = m.lot + "|" + m.loc; bal[k] = (bal[k] || 0) + m.qty; });
const lotRows = Object.entries(bal).filter(([, v]) => Math.abs(v) > 1e-6).map(([k, v]) => {
  const [lot, loc] = k.split("|"); return { lot, loc, item: LOTS[lot].item, qty: v };
});
const usable = item => lotRows.filter(r => r.item === item && LOC[r.loc].usable).reduce((a, r) => a + r.qty, 0);

const JS = {};
D.jobs.forEach(j => JS[j.no] = { output: 0, scrap: 0, regrind: 0, issued: 0, started: null, lastOut: null });
D.mv.forEach(m => {
  if (!m.job || !JS[m.job]) return;
  const s = JS[m.job];
  if (m.eff === "output") { s.output += m.qty; if (m.t === "output" && (!s.lastOut || m.occ > s.lastOut)) s.lastOut = m.occ; }
  else if (m.eff === "scrap") s.scrap -= m.qty;
  else if (m.eff === "regrind_return") s.regrind += m.qty;
  else if (m.eff === "issue") { s.issued -= m.qty; if (m.t === "issue" && (!s.started || m.occ < s.started)) s.started = m.occ; }
});
D.jobs.forEach(j => {
  const s = JS[j.no]; s.good = s.output - s.scrap;
  s.yield = s.issued > 0 ? s.good * I[j.item].kgpm / s.issued * 100 : null;
});

const disp = {}, lastDisp = {};
D.mv.forEach(m => {
  if (m.eff !== "dispatch" || !m.so) return;
  const k = m.so.join("|"); disp[k] = (disp[k] || 0) - m.qty;
  if (!lastDisp[k] || m.occ > lastDisp[k]) lastDisp[k] = m.occ;
});
const OL = D.orders.flatMap(o => o.lines.map(l => {
  const k = o.no + "|" + l.item, d = disp[k] || 0, out = Math.max(l.qty - d, 0);
  const status = d >= l.qty ? "complete" : l.due < TODAY ? "late" : d > 0 ? "part" : "open";
  return { ...l, no: o.no, customer: o.customer, ref: o.ref, date: o.date, dispatched: d, outstanding: out, status, last: lastDisp[k] || null,
    jobs: D.jobs.filter(j => j.so && j.so[0] === o.no && j.so[1] === l.item) };
}));
const OLS = { complete: "Complete", late: "Late", part: "Part dispatched", open: "Open" };

const MRP = (() => {
  const req = {}, why = {};
  D.jobs.filter(j => j.status === "planned" || j.status === "released").forEach(j => {
    const v = REC[j.recipe].versions.find(x => x.v === j.ver);
    for (const [it, f] of Object.entries(v.lines)) {
      req[it] = (req[it] || 0) + j.planned * I[j.item].kgpm * 1.05 * f;
      (why[it] = why[it] || []).push(j.no);
    }
  });
  return Object.keys(req).map(it => ({ item: it, req: req[it], avail: usable(it), short: Math.max(req[it] - usable(it), 0), jobs: why[it] }))
    .sort((a, b) => b.short - a.short || a.item.localeCompare(b.item));
})();

const POLISH_AT = 35;
const DS = Object.fromEntries(Object.keys(DIES).map(code => {
  const ev = D.dieEvents.filter(e => e.die === code && e.at <= D.now);
  const lp = [...ev].reverse().find(e => e.ev === "polish");
  const runs = ev.filter(e => e.ev === "run" && (!lp || e.at > lp.at)).length;
  const lr = [...ev].reverse().find(e => e.ev === "run");
  const next = D.jobs.filter(j => j.die === code && (j.status === "planned" || j.status === "released")).sort((a, b) => a.start.localeCompare(b.start))[0];
  return [code, { code, runs, lastPolish: lp, lastRun: lr, next, events: ev }];
}));

function inputsOf(job) {
  const m = {};
  D.mv.forEach(x => { if (x.job === job && x.eff === "issue") m[x.lot] = (m[x.lot] || 0) - x.qty; });
  return Object.entries(m).filter(([, v]) => v > 1e-6).map(([lot, v]) => ({ lot, qty: v }));
}
function usesOf(lot) {
  const jobs = {}, orders = {};
  D.mv.forEach(x => {
    if (x.lot !== lot) return;
    if (x.eff === "issue" && x.job) jobs[x.job] = (jobs[x.job] || 0) - x.qty;
    if (x.eff === "dispatch" && x.so) { const k = x.so[0]; orders[k] = (orders[k] || 0) - x.qty; }
  });
  return {
    jobs: Object.entries(jobs).filter(([, v]) => v > 1e-6).map(([job, v]) => ({ job, qty: v })),
    orders: Object.entries(orders).filter(([, v]) => v > 1e-6).map(([no, v]) => ({ no, qty: v }))
  };
}

// week figures
const monday = key => addDays(key, -((wd(key) + 6) % 7));
const THIS_MON = monday(TODAY);
function weekFigs(from, cutoff) {
  const to = dayKey(cutoff);
  let out = 0, scrap = 0, dispatched = 0, goodKg = 0, issued = 0;
  D.mv.forEach(m => {
    const k = dayKey(m.occ); if (k < from || new Date(m.occ) > cutoff) return;
    if (m.eff === "output") out += m.qty;
    if (m.eff === "scrap" && m.job) scrap -= m.qty;
    if (m.eff === "dispatch") dispatched -= m.qty;
  });
  D.jobs.filter(j => j.status === "complete" && j.start >= from && j.start <= to && new Date(JS[j.no].lastOut) <= cutoff)
    .forEach(j => { goodKg += JS[j.no].good * I[j.item].kgpm; issued += JS[j.no].issued; });
  const due = OL.filter(l => l.due >= from && l.due <= to && l.due <= TODAY);
  const onTime = due.filter(l => l.status === "complete" && l.last && dayKey(l.last) <= l.due).length;
  return { good: out - scrap, scrap, yield: issued ? goodKg / issued * 100 : null, dispatched, due: due.length, onTime };
}

// attention list
const ATT = (() => {
  const a = [];
  MRP.filter(r => r.short > 0).forEach(r => a.push({ lvl: "bad", title: `Short of ${short(r.item)}`,
    body: `Jobs ${r.jobs.join(" and ")} need ${q(r.req, "kg")}; ${q(r.avail, "kg")} is usable in stock.`, fig: "−" + q(r.short, "kg"), href: "#/stock/plan" }));
  OL.filter(l => l.status === "late").forEach(l => a.push({ lvl: "bad", title: `${l.no} is late`,
    body: `${l.customer}: ${q(l.outstanding, "m")} of ${short(l.item).toLowerCase()} was due ${fDay(l.due)}.`, fig: q(l.outstanding, "m"), href: `#/orders/${l.no}` }));
  Object.values(DS).filter(d => d.runs >= POLISH_AT && d.next).forEach(d => a.push({ lvl: "warn", title: `Die ${d.code} is due a polish`,
    body: `${d.runs} runs since its last polish. Next needed for job ${d.next.no} on ${fDay(d.next.start)}.`, fig: d.runs + " runs", href: "#/dies" }));
  D.mv.filter(m => dayKey(m.occ) === TODAY && !m.job && (m.eff === "scrap" || m.eff === "adjustment") && m.occ <= D.now)
    .forEach(m => a.push({ lvl: "warn", title: `${short(m.item)} written off today`, body: m.note || "", fig: qi(-m.qty, m.item), href: "#/ledger" }));
  lotRows.filter(r => !LOC[r.loc].usable && r.qty > 0).forEach(r => a.push({ lvl: "warn", title: `${r.lot} held in quarantine`,
    body: `${short(r.item)} awaiting QA decision.`, fig: qi(r.qty, r.item), href: `#/trace/${r.lot}` }));
  return a;
})();

// ---------- icons ----------
const ICON = {
  overview: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><path d="M13.5 17h7M17 13.5v7"/></svg>',
  orders: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V2.8h6V4M8.5 9.5h7M8.5 13h7M8.5 16.5h4"/></svg>',
  jobs: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="1"/><path d="M7 9.5h4.2v5H7zM12.8 9.5H17v5h-4.2z"/></svg>',
  stock: '<svg viewBox="0 0 24 24"><path d="M3.5 12.5h8v7h-8zM12.5 12.5h8v7h-8zM8 4.5h8v8H8z"/></svg>',
  trace: '<svg viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="2"/><circle cx="18.5" cy="12" r="2"/><circle cx="5.5" cy="18" r="2"/><path d="M7.5 6h4v6h5M11.5 12v6h-4"/></svg>',
  dies: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 9.5h6v5H9z"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2"/></svg>',
  ledger: '<svg viewBox="0 0 24 24"><path d="M5 3.5h14v17H5z"/><path d="M8.5 8h7M8.5 11.5h7M8.5 15h7"/><path d="M5 3.5v17"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
  print: '<svg viewBox="0 0 24 24"><path d="M7 9V3.5h10V9M7 17H4.5V9.5h15V17H17M7 14h10v6.5H7z"/></svg>'
};
const NAV = [["overview", "Overview"], ["orders", "Orders"], ["jobs", "Jobs"], ["stock", "Stock"], ["trace", "Traceability"], ["dies", "Dies"], ["ledger", "Ledger"]];

// ---------- shared bits ----------
const JOBST = { complete: "Complete", running: "Running", released: "Released", planned: "Planned", cancelled: "Cancelled" };
const st = (cls, label) => `<span class="st ${cls}"><i></i><span>${esc(label)}</span></span>`;
const jobSt = j => st(j.status, JOBST[j.status]);
const bar = (v, max, cls = "") => `<div class="bar ${cls}"><b style="width:${Math.max(0, Math.min(100, max ? v / max * 100 : 0)).toFixed(1)}%"></b></div>`;
const jobLink = n => `<a href="#/jobs/${n}">${n}</a>`;
const lotLink = l => `<a href="#/trace/${encodeURIComponent(l)}">${esc(l)}</a>`;
const soLink = n => `<a href="#/orders/${n}">${n}</a>`;
function head(title, sub, crumbs, right = "") {
  return `${crumbs ? `<div class="crumbs">${crumbs}</div>` : ""}<div class="head"><div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}</div>${right}</div>`;
}
function describe(m) {
  const it = short(m.item), qa = qi(Math.abs(m.qty), m.item);
  switch (m.t) {
    case "receipt": return `Received ${qa} of ${it}`;
    case "issue": return `Issued ${qa} of ${it}`;
    case "output": return `Produced ${qa}`;
    case "scrap": return `Scrapped ${qa}`;
    case "regrind_return": return `Returned ${qa} to regrind`;
    case "transfer_out": return `Moved ${qa} out of ${LOCS[m.loc]}`;
    case "transfer_in": return `Moved ${qa} into ${LOCS[m.loc]}`;
    case "dispatch": return `Dispatched ${qa} to ${esc(custOf(m.so))}`;
    case "adjustment": return `Stock-take adjustment ${m.qty > 0 ? "+" : "−"}${qa}`;
    case "reversal": return `Reversed entry #${m.rev}`;
  }
  return m.t;
}
const dieText = e => ({ run: `Run started on die ${e.die}`, clean: `Die ${e.die} cleaned`, polish: `Die ${e.die} polished`, repair: `Die ${e.die} repaired`, retire: `Die ${e.die} retired` }[e.ev]) + (e.note && e.ev !== "clean" ? ` <span class="muted">(${esc(e.note)})</span>` : "");
const lateBy = m => (new Date(m.rec) - new Date(m.occ)) / 60000;

// ================= VIEWS =================
function vOverview() {
  const running = D.jobs.filter(j => j.status === "running");
  const lines = ["LINE1", "LINE2"].map(ln => {
    const j = running.find(x => x.line === ln);
    if (!j) return `<div class="line-now"><div class="ln-top"><span class="ln">${lineName(ln)}</span>${st("planned", "Idle")}</div></div>`;
    const s = JS[j.no], rate = s.lastOut ? s.output / ((new Date(s.lastOut) - new Date(s.started)) / 3.6e6) : 0;
    const eta = rate ? new Date(new Date(s.lastOut).getTime() + (j.planned - s.output) / rate * 3.6e6) : null;
    const v = REC[j.recipe].versions.find(x => x.v === j.ver);
    return `<div class="line-now">
      <div class="ln-top"><span class="ln">${lineName(ln)} ${ln === "LINE2" ? "(co-ex)" : ""}</span>${jobSt(j)}</div>
      <div class="ln-job"><a class="jn" href="#/jobs/${j.no}">${j.no}</a><div><div class="what">${esc(I[j.item].name)}</div>
        <div class="who">${j.so ? `${soLink(j.so[0])} for ${esc(custOf(j.so))}` : "Stock run"}</div></div></div>
      <div class="ln-meter">${bar(s.output, j.planned)}
        <div class="ln-figs"><span><b>${n0.format(s.output)}</b> of ${n0.format(j.planned)} m</span><span>${eta ? `Done about <b>${fTime(eta)}</b> at this rate` : ""}</span></div></div>
      <div class="ln-facts">
        <div class="fact"><small>Die</small><b>${j.die}</b></div>
        <div class="fact"><small>Recipe</small><b>${j.recipe} v${j.ver}</b></div>
        <div class="fact"><small>Started</small><b>${fTime(s.started)}</b></div>
        <div class="fact"><small>Last count</small><b>${fTime(s.lastOut)}</b></div>
      </div>
          </div>`;
  }).join("");

  const tw = weekFigs(THIS_MON, NOW), lw = weekFigs(addDays(THIS_MON, -7), new Date(NOW.getTime() - 7 * 864e5));
  const delta = (a, b, unit = "%", inv = false) => {
    if (b == null || a == null || !b) return `<em>no comparison</em>`;
    const d = unit === "pt" ? a - b : (a - b) / b * 100; const up = d >= 0;
    const good = inv ? !up : up;
    return `<em class="${Math.abs(d) < 0.05 ? "" : good ? "up" : "down"}">${up ? "+" : "−"}${n1.format(Math.abs(d))}${unit === "pt" ? " pts" : "%"} on this time last week</em>`;
  };
  const strip = `<div class="tb">
    <div><small>Good output this week</small><b>${n0.format(tw.good)} m</b>${delta(tw.good, lw.good)}</div>
    <div><small>Yield on finished jobs</small><b>${pct(tw.yield)}</b>${delta(tw.yield, lw.yield, "pt")}</div>
    <div><small>Scrap</small><b>${n0.format(tw.scrap)} m</b>${delta(tw.scrap, lw.scrap, "%", true)}</div>
    <div><small>Dispatched</small><b>${n0.format(tw.dispatched)} m</b>${delta(tw.dispatched, lw.dispatched)}</div>
    <div><small>Order lines due so far, on time</small><b>${tw.onTime} of ${tw.due}</b><em>${tw.due - tw.onTime ? `${tw.due - tw.onTime} missed` : "none missed"}</em></div>
  </div>`;

  const att = ATT.length ? `<ul class="att">${ATT.map(x => `<li><a class="row" href="${x.href}"><span class="mk ${x.lvl}"></span><div><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div><span class="fig ${x.lvl}">${esc(x.fig)}</span></a></li>`).join("")}</ul>`
    : `<div class="empty"><b>Nothing needs attention</b>Shortages, late orders and die maintenance will show here.</div>`;

  const soon = OL.filter(l => l.status !== "complete").sort((a, b) => a.due.localeCompare(b.due)).slice(0, 7);
  const recent = [...D.mv].filter(m => m.rec <= D.now).sort((a, b) => b.rec.localeCompare(a.rec)).slice(0, 7);

  return head(`${fDayLong(NOW)}`, `Two lines running. ${ATT.length ? `${ATT.length} thing${ATT.length > 1 ? "s" : ""} need${ATT.length > 1 ? "" : "s"} attention.` : "Nothing needs attention."}`) + `
  <div class="stack">
    <div class="grid g-2">
      <div class="lines-now">${lines}</div>
      <section class="panel"><div class="ph"><h2>Needs attention</h2><span class="aside">${ATT.length} open</span></div>${att}</section>
    </div>
    <section class="panel">
      <div class="ph"><h2>Line board</h2><div class="tools no-print"><div class="legend"><span><i></i>Done</span><span><i class="r"></i>Running</span><span><i class="rl"></i>Released</span><span><i class="p"></i>Planned</span></div>
        <div class="seg" role="group" aria-label="Weeks"><button data-wk="-1" aria-pressed="${boardOffset === -1}">Last week</button><button data-wk="0" aria-pressed="${boardOffset === 0}">This fortnight</button></div></div></div>
      <div class="board-wrap">${board()}</div>
    </section>
    ${strip}
    <div class="grid g-2e">
      <section class="panel"><div class="ph"><h2>Due to go out</h2><a class="aside" href="#/orders">Order book</a></div><div class="scroll">
        <table class="tbl dense"><thead><tr><th>Due</th><th>Order</th><th>Product</th><th class="num">Outstanding</th><th>Status</th></tr></thead><tbody>
        ${soon.map(l => `<tr class="go" data-href="#/orders/${l.no}"><td>${fDay(l.due)}</td><td class="id">${soLink(l.no)}<span class="two">${esc(l.customer)}</span></td><td>${esc(short(l.item))}</td><td class="num">${q(l.outstanding, "m")}</td><td>${st(l.status, OLS[l.status])}</td></tr>`).join("")}
        </tbody></table></div></section>
      <section class="panel"><div class="ph"><h2>Latest entries</h2><a class="aside" href="#/ledger">Full ledger</a></div><div class="scroll">
        <table class="tbl dense"><thead><tr><th>Time</th><th>What</th><th>Lot</th></tr></thead><tbody>
        ${recent.map(m => `<tr><td class="muted">${fTime(m.rec)}</td><td>${describe(m)}${m.job ? ` <span class="muted small">job ${jobLink(m.job)}</span>` : ""}</td><td>${lotLink(m.lot)}</td></tr>`).join("")}
        </tbody></table></div></section>
    </div>
  </div>`;
}

let boardOffset = 0;
function board() {
  const start = addDays(THIS_MON, boardOffset * 7);
  const days = []; let k = start;
  while (days.length < 10) { if (wd(k) !== 0 && wd(k) !== 6) days.push(k); k = addDays(k, 1); }
  const hd = `<div class="bd-row bd-head"><div></div>${days.map((d, i) => `<div class="${d === TODAY ? "today" : ""} ${i === 5 ? "wk" : ""}"><b>${fDay(d).split(" ").slice(0, 2).join(" ")}</b>${i === 0 || i === 5 ? fDay(d).split(" ")[2] : ""}</div>`).join("")}</div>`;
  const flags = {};
  MRP.filter(r => r.short > 0).forEach(r => r.jobs.forEach(n => flags[n] = "bad"));
  Object.values(DS).filter(d => d.runs >= POLISH_AT && d.next).forEach(d => flags[d.next.no] = flags[d.next.no] || "warn");
  const rows = ["LINE1", "LINE2"].map(ln => `<div class="bd-row bd-line"><div class="bd-lab"><b>${lineName(ln)}</b><span>${ln === "LINE1" ? "Single-screw" : "Co-ex"}</span></div>
    ${days.map((d, i) => {
      const js = D.jobs.filter(j => j.line === ln && j.start === d);
      return `<div class="bd-cell ${i === 5 ? "wk" : ""} ${d < TODAY ? "past" : ""}">${js.map(j => {
        const s = JS[j.no], fl = flags[j.no];
        return `<a class="jb ${j.status}" href="#/jobs/${j.no}" title="${esc(JOBST[j.status] + ": " + I[j.item].name)}">
          ${fl ? `<span class="flag ${fl === "bad" ? "bad" : ""}" aria-label="Needs attention"></span>` : ""}
          <span class="n">${j.no}</span><span class="p">${esc(tiny(j.item))}</span>
          <span class="q">${j.status === "complete" ? n0.format(s.good) + " m made" : j.status === "running" ? n0.format(s.output) + " of " + n0.format(j.planned) : n0.format(j.planned) + " m"}</span>
          ${j.status === "running" ? `<span class="fill" style="width:${(s.output / j.planned * 100).toFixed(1)}%"></span>` : ""}</a>`;
      }).join("")}</div>`;
    }).join("")}</div>`).join("");
  let now = "";
  const idx = days.indexOf(TODAY);
  if (idx >= 0) {
    const h = new Date(D.now).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ }).split(":").map(Number);
    const frac = Math.max(0, Math.min(1, (h[0] + h[1] / 60 - 6) / 8.5));
    now = `<div class="now" style="left:calc(var(--lw) + (100% - var(--lw)) * ${((idx + frac) / 10).toFixed(4)})"><span class="now-dot"></span><span class="now-tag">Now ${fTime(D.now)}</span></div>`;
  }
  return `<div class="board">${hd}<div style="position:relative">${rows}${now}</div></div>`;
}

// ---------- orders ----------
let orderFilter = "open";
function vOrders() {
  const counts = { all: OL.length, open: OL.filter(l => l.status !== "complete").length, late: OL.filter(l => l.status === "late").length, complete: OL.filter(l => l.status === "complete").length };
  const rows = OL.filter(l => orderFilter === "all" || (orderFilter === "open" ? l.status !== "complete" : l.status === orderFilter))
    .sort((a, b) => orderFilter === "complete" ? b.due.localeCompare(a.due) : a.due.localeCompare(b.due));
  const segs = [["open", "Open"], ["late", "Late"], ["complete", "Complete"], ["all", "All"]]
    .map(([k, l]) => `<button data-of="${k}" aria-pressed="${orderFilter === k}">${l}<span class="n">${counts[k]}</span></button>`).join("");
  return head("Orders", "Every order line, what has gone out against it and what is still to make.", "", `<div class="seg no-print" role="group" aria-label="Filter">${segs}</div>`) + `
  <section class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th class="num">Ordered</th><th style="min-width:170px">Dispatched</th><th>Due</th><th>Status</th><th>Jobs</th></tr></thead><tbody>
  ${rows.map(l => `<tr class="go" data-href="#/orders/${l.no}"><td class="id">${soLink(l.no)}<span class="two">Their ref ${esc(l.ref)}</span></td>
    <td>${esc(l.customer)}</td><td>${esc(short(l.item))}<span class="two">${l.item}</span></td><td class="num">${q(l.qty, "m")}</td>
    <td><div class="prog">${bar(l.dispatched, l.qty, l.status === "late" ? "bad" : l.status === "complete" ? "done" : "")}<span>${n0.format(l.dispatched)}</span></div></td>
    <td>${fDay(l.due)}</td><td>${st(l.status, OLS[l.status])}</td><td>${l.jobs.map(j => jobLink(j.no)).join(", ") || `<span class="muted">From stock</span>`}</td></tr>`).join("") ||
    `<tr><td colspan="8"><div class="empty"><b>No order lines here</b>Try another filter.</div></td></tr>`}
  </tbody></table></div></section>`;
}
function vOrder(no) {
  const o = D.orders.find(x => x.no === no); if (!o) return notFound("order", no);
  const lines = OL.filter(l => l.no === no);
  const ds = D.mv.filter(m => m.eff === "dispatch" && m.so && m.so[0] === no).sort((a, b) => a.occ.localeCompare(b.occ));
  return head(`${o.no}`, `${esc(o.customer)}, their order ${esc(o.ref)}, placed ${fDay(o.date)}.`, `<a href="#/orders">Orders</a> / ${o.no}`) + `
  <div class="stack">
  <section class="panel"><div class="ph"><h2>Lines</h2></div><div class="scroll"><table class="tbl"><thead><tr><th>Product</th><th class="num">Ordered</th><th style="min-width:170px">Dispatched</th><th class="num">Outstanding</th><th>Due</th><th>Status</th><th>Made on</th></tr></thead><tbody>
  ${lines.map(l => `<tr><td>${esc(I[l.item].name)}<span class="two">${l.item}</span></td><td class="num">${q(l.qty, "m")}</td>
   <td><div class="prog">${bar(l.dispatched, l.qty, l.status === "late" ? "bad" : l.status === "complete" ? "done" : "")}<span>${n0.format(l.dispatched)}</span></div></td>
   <td class="num">${q(l.outstanding, "m")}</td><td>${fDay(l.due)}</td><td>${st(l.status, OLS[l.status])}</td>
   <td>${l.jobs.map(j => `${jobLink(j.no)} ${jobSt(j)}`).join("<br>") || `<span class="muted">Supplied from stock</span>`}</td></tr>`).join("")}
  </tbody></table></div></section>
  <section class="panel"><div class="ph"><h2>Dispatches</h2><span class="aside">${ds.length} despatch note${ds.length === 1 ? "" : "s"}</span></div>
  ${ds.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Despatch note</th><th>Product</th><th>Lot</th><th>Made on</th><th class="num">Quantity</th></tr></thead><tbody>
  ${ds.map(m => `<tr><td>${fWhen(m.occ)}</td><td>${esc(m.ref)}</td><td>${esc(short(m.item))}</td><td>${lotLink(m.lot)}</td><td>${LOTS[m.lot].src ? jobLink(LOTS[m.lot].src) : "–"}</td><td class="num">${q(-m.qty, "m")}</td></tr>`).join("")}
  </tbody></table></div>` : `<div class="empty"><b>Nothing dispatched yet</b>Despatch notes will appear here as goods leave.</div>`}
  </section></div>`;
}

// ---------- jobs ----------
let jobFilter = "all";
function vJobs() {
  const segs = [["all", "All"], ["LINE1", "Line 1"], ["LINE2", "Line 2"], ["open", "Not started"]]
    .map(([k, l]) => `<button data-jf="${k}" aria-pressed="${jobFilter === k}">${l}</button>`).join("");
  const rows = D.jobs.filter(j => jobFilter === "all" || j.line === jobFilter || (jobFilter === "open" && ["planned", "released"].includes(j.status)))
    .sort((a, b) => b.start.localeCompare(a.start) || b.no.localeCompare(a.no));
  return head("Jobs", "Each run on each line, with the recipe version and die it used and how well it ran.", "", `<div class="seg no-print" role="group" aria-label="Filter">${segs}</div>`) + `
  <section class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>Job</th><th>Start</th><th>Product</th><th>Die</th><th>Recipe</th><th class="num">Planned</th><th class="num">Good</th><th class="num">Yield</th><th>Status</th></tr></thead><tbody>
  ${rows.map(j => { const s = JS[j.no]; return `<tr class="go" data-href="#/jobs/${j.no}"><td class="id">${jobLink(j.no)}<span class="two">${lineName(j.line)}</span></td>
    <td>${fDay(j.start)}</td><td>${esc(short(j.item))}<span class="two">${j.so ? `${j.so[0]}, ${esc(custOf(j.so))}` : "Stock run"}</span></td>
    <td>${j.die}</td><td>${j.recipe} v${j.ver}</td><td class="num">${q(j.planned, "m")}</td>
    <td class="num">${s.output ? q(s.good, "m") : "–"}</td><td class="num">${j.status === "complete" && s.yield ? pct(s.yield) : "–"}</td><td>${jobSt(j)}</td></tr>`; }).join("")}
  </tbody></table></div></section>`;
}
function vJob(no) {
  const j = J[no]; if (!j) return notFound("job", no);
  const s = JS[no], it = I[j.item], ver = REC[j.recipe].versions.find(x => x.v === j.ver);
  const started = s.output > 0 || s.issued > 0;
  // materials
  const byItem = {};
  D.mv.filter(m => m.job === no && m.eff === "issue").forEach(m => {
    const b = byItem[m.item] = byItem[m.item] || { kg: 0, lots: {} }; b.kg -= m.qty; b.lots[m.lot] = (b.lots[m.lot] || 0) - m.qty;
  });
  const need = kg => j.planned * it.kgpm * 1.05 * kg;
  const mats = Object.entries(ver.lines).map(([code, f]) => {
    const b = byItem[code] || { kg: 0, lots: {} }, act = s.issued ? b.kg / s.issued * 100 : null;
    const lots = Object.entries(b.lots).filter(([, v]) => v > 1e-6);
    if (!started) {
      const r = need(f), av = usable(code), sh = Math.max(r - av, 0);
      return `<tr><td>${esc(I[code].name)}<span class="two">${code}</span></td><td class="num">${n0.format(f * 100)}%</td><td class="num">${q(r, "kg")}</td><td class="num">${q(av, "kg")}</td><td>${sh > 0 ? `<span class="chip bad">Short ${q(sh, "kg")}</span>` : `<span class="chip sea">Covered</span>`}</td></tr>`;
    }
    return `<tr><td>${esc(I[code].name)}<span class="two">${code}</span></td><td class="num">${n0.format(f * 100)}%</td><td class="num">${q(b.kg, "kg")}</td>
      <td class="num">${act == null ? "–" : pct(act)}</td><td>${lots.map(([l, v]) => `${lotLink(l)} <span class="muted small">${q(v, "kg")}</span>`).join("<br>")}</td></tr>`;
  }).join("");
  const matHead = started ? `<th>Material</th><th class="num">Recipe</th><th class="num">Issued</th><th class="num">Actual</th><th>From lots</th>` :
    `<th>Material</th><th class="num">Recipe</th><th class="num">Needed</th><th class="num">Usable stock</th><th></th>`;
  // timeline
  const ev = D.mv.filter(m => m.job === no || (m.lot === "FG-" + no && !m.job) || m.lot === "RG-" + no && m.t === "regrind_return")
    .map(m => ({ at: m.occ, rec: m.rec, kind: m.t === "reversal" ? "reversal" : m.eff === "issue" ? "issue" : m.eff, text: describe(m) + (m.t === "reversal" ? ` (${esc(m.note)})` : m.note && m.t !== "reversal" ? ` <span class="muted">(${esc(m.note)})</span>` : ""), lot: m.lot, m }))
    .concat(D.dieEvents.filter(e => e.job === no).map(e => ({ at: e.at, kind: "die", text: dieText(e) })))
    .filter(e => e.at <= D.now).sort((a, b) => a.at.localeCompare(b.at));
  const fl = [];
  MRP.filter(r => r.short > 0 && r.jobs.includes(no)).forEach(r => fl.push(`<div class="note"><b>Material shortfall.</b> ${esc(short(r.item))} is ${q(r.short, "kg")} short across jobs ${r.jobs.join(" and ")}.</div>`));
  const dsx = DS[j.die]; if (!started && dsx.runs >= POLISH_AT) fl.push(`<div class="note"><b>Die due a polish.</b> ${j.die} has done ${dsx.runs} runs since it was last polished.</div>`);
  if (j.notes) fl.push(`<div class="note plain">${esc(j.notes)}</div>`);
  const outLots = Object.keys(LOTS).filter(l => LOTS[l].src === no);
  const figs = started ? `<div class="figs">
     <div><small>Planned</small><b>${n0.format(j.planned)} m</b></div><div><small>Produced</small><b>${n0.format(s.output)} m</b></div>
     <div><small>Scrapped</small><b>${n0.format(s.scrap)} m</b></div><div><small>Good</small><b>${n0.format(s.good)} m</b></div>
     <div><small>Regrind back</small><b>${q(s.regrind, "kg")}</b></div><div><small>Yield</small><b>${j.status === "complete" ? pct(s.yield) : "Running"}</b></div></div>` : "";
  return `<div class="crumbs"><a href="#/jobs">Jobs</a> / ${no}</div>
  <div class="grid g-side">
    <div class="stack">
      <div class="sheet"><div class="sheet-title"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div><div class="big">Job ${no}</div><p class="sub" style="font-size:15px;color:var(--ink);font-weight:560">${esc(it.name)}</p></div>
        <div class="tools no-print">${jobSt(j)}<button class="btn" onclick="window.print()">${ICON.print}Print job sheet</button></div></div>
        ${j.status === "running" ? `<div style="margin-top:14px">${bar(s.output, j.planned)}<div class="ln-figs"><span><b>${n0.format(s.output)}</b> of ${n0.format(j.planned)} m so far</span><span>Last count ${fTime(s.lastOut)}</span></div></div>` : ""}
      </div>${figs}</div>
      ${fl.join("")}
      <section class="panel"><div class="ph"><h2>${started ? "Materials used" : "Materials needed"}</h2><span class="aside">Recipe ${j.recipe} v${j.ver}${started ? "" : ", including 5% allowance"}</span></div>
        <div class="scroll"><table class="tbl"><thead><tr>${matHead}</tr></thead><tbody>${mats}</tbody></table></div></section>
      ${ev.length ? `<section class="panel"><div class="ph"><h2>What happened</h2><span class="aside">From the ledger and die log</span></div><ul class="timeline">
        ${ev.map(e => `<li><span class="t">${fDay(e.at).split(" ").slice(0, 2).join(" ")}, ${fTime(e.at)}</span><span class="dot ${e.kind === "die" ? "die" : e.kind}"></span>
          <span>${e.text}${e.m && lateBy(e.m) > 60 ? `<span class="late">entered ${fWhen(e.m.rec)}</span>` : ""}</span><span>${e.lot ? lotLink(e.lot) : ""}</span></li>`).join("")}</ul></section>` : ""}
    </div>
    <div class="stack">
      <div class="sheet"><div class="tblock">
        <div><small>Line</small><b>${lineName(j.line)}</b></div><div><small>Planned start</small><b>${fDay(j.start)}</b></div>
        <div><small>Die</small><b><a href="#/dies">${j.die}</a></b></div><div><small>Recipe</small><b>${j.recipe} v${j.ver}</b></div>
        <div><small>Order</small><b>${j.so ? soLink(j.so[0]) : "Stock run"}</b></div><div><small>Weight</small><b>${n1.format(it.kgpm * 1000)} g/m</b></div>
        <div class="full"><small>Customer</small><b>${j.so ? esc(custOf(j.so)) : "–"}</b></div>
        <div class="full"><small>Recipe note</small><b style="font-weight:500">${esc(ver.notes)}</b></div>
        <div class="full" style="border-bottom:0"><small>Output lots</small><b>${outLots.length ? outLots.map(lotLink).join(", ") : "None yet"}</b></div>
      </div></div>
    </div>
  </div>`;
}

// ---------- stock ----------
function vStock(tab = "hand") {
  const tabs = `<nav class="seg no-print" aria-label="Stock views">${[["hand", "On hand"], ["plan", "Material plan"], ["quar", "Quarantine"]].map(([k, l]) => `<a href="#/stock/${k}" aria-current="${tab === k ? "page" : "false"}">${l}</a>`).join("")}</nav>`;
  let body = "";
  if (tab === "plan") {
    body = `<section class="panel"><div class="ph"><h2>Material needed for released and planned jobs</h2><span class="aside">Recipe quantities plus 5% allowance, against usable stock</span></div>
      <div class="scroll"><table class="tbl"><thead><tr><th>Material</th><th class="num">Needed</th><th class="num">Usable stock</th><th style="min-width:180px">Cover</th><th class="num">Shortfall</th><th>For jobs</th></tr></thead><tbody>
      ${MRP.map(r => `<tr><td>${esc(I[r.item].name)}<span class="two">${r.item}</span></td><td class="num">${q(r.req, "kg")}</td><td class="num">${q(r.avail, "kg")}</td>
        <td><div class="prog">${bar(Math.min(r.avail, r.req), r.req, r.short > 0 ? "bad" : "")}<span>${n0.format(Math.min(r.avail / r.req * 100, 999))}%</span></div></td>
        <td class="num">${r.short > 0 ? `<b style="color:var(--brick)">${q(r.short, "kg")}</b>` : `<span class="muted">None</span>`}</td><td>${r.jobs.map(jobLink).join(", ")}</td></tr>`).join("")}
      </tbody></table></div></section>`;
  } else if (tab === "quar") {
    const held = lotRows.filter(r => !LOC[r.loc].usable && r.qty > 0);
    const past = D.mv.filter(m => m.loc === "QUAR").sort((a, b) => b.occ.localeCompare(a.occ));
    body = `<section class="panel"><div class="ph"><h2>Held stock</h2><span class="aside">Quarantined stock is left out of the material plan and cannot be dispatched</span></div>
      ${held.length ? `<table class="tbl"><tbody>${held.map(r => `<tr><td>${lotLink(r.lot)}</td><td>${esc(short(r.item))}</td><td class="num">${qi(r.qty, r.item)}</td></tr>`).join("")}</tbody></table>`
        : `<div class="empty"><b>Nothing is on hold</b>When a batch is held for a quality check it appears here until it is released or scrapped.</div>`}</section>
      <section class="panel"><div class="ph"><h2>Quarantine history</h2></div><div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>What</th><th>Lot</th><th>Reason</th></tr></thead><tbody>
      ${past.map(m => `<tr><td>${fWhen(m.occ)}</td><td>${describe(m)}</td><td>${lotLink(m.lot)}</td><td class="muted">${esc(m.note || "")}</td></tr>`).join("")}</tbody></table></div></section>`;
  } else {
    const groups = [["raw_material", "Raw materials"], ["masterbatch", "Masterbatch"], ["regrind", "Regrind"], ["finished", "Finished goods"]];
    body = `<section class="panel">${groups.map(([kind, label]) => {
      const codes = Object.keys(I).filter(c => I[c].kind === kind);
      return `<div class="kind-h">${label}</div>` + codes.map(c => {
        const rs = lotRows.filter(r => r.item === c && r.qty > 1e-6).sort((a, b) => LOTS[a.lot].created.localeCompare(LOTS[b.lot].created));
        const tot = rs.filter(r => LOC[r.loc].usable).reduce((a, r) => a + r.qty, 0);
        const locs = [...new Set(rs.map(r => LOCS[r.loc]))];
        return `<details class="grp"><summary><span><b>${esc(I[c].name)}</b> <span class="muted small">${c}</span></span><span class="num" style="font-weight:680">${qi(tot, c)}</span>
          <span class="muted small">${rs.length} lot${rs.length === 1 ? "" : "s"}${locs.length ? ", " + esc(locs.join(", ")) : ""}</span>${ICON.chev}</summary>
          <div class="inner">${rs.length ? `<table class="tbl dense"><thead><tr><th>Lot</th><th>Where</th><th>Came from</th><th>Date</th><th class="num">Quantity</th></tr></thead><tbody>
          ${rs.map(r => { const L = LOTS[r.lot]; return `<tr><td>${lotLink(r.lot)}</td><td>${LOCN[r.loc]}</td><td>${L.src ? `Job ${jobLink(L.src)}` : esc(L.sref || "")}</td><td>${fDay(L.created)}</td><td class="num">${qi(r.qty, c)}</td></tr>`; }).join("")}
          </tbody></table>` : `<p class="muted small" style="margin:6px 0 0">None in stock.</p>`}</div></details>`;
      }).join("");
    }).join("")}</section>`;
  }
  return head("Stock", "Worked out live from the ledger: every figure is the sum of the movements behind it.", "", tabs) + `<div class="stack">${body}</div>`;
}

// ---------- traceability ----------
function vTrace(lot) {
  const all = Object.keys(LOTS).sort();
  const pick = `<form class="tools no-print" id="traceform"><input list="lotlist" name="lot" placeholder="Lot code, e.g. FG-1025" value="${esc(lot || "")}" aria-label="Lot code" style="width:220px"><datalist id="lotlist">${all.map(l => `<option value="${l}">`).join("")}</datalist><button class="btn" type="submit">Trace</button></form>`;
  if (!lot) {
    const ex = ["FG-1025", "RG-1013", "GRN-2593", "FG-1029"];
    return head("Traceability", "Follow any batch back to the supplier deliveries it was made from, or forward to the customers who received it.", "", pick) +
      `<section class="panel"><div class="empty"><b>Enter a lot code to trace it</b>Try ${ex.map(lotLink).join(", ")}.</div></section>`;
  }
  const L = LOTS[lot]; if (!L) return head("Traceability", "", "", pick) + notFound("lot", lot);
  const back = (code, depth, seen) => {
    const x = LOTS[code];
    if (!x.src || depth > 4 || seen.has(code)) return "";
    seen.add(code);
    const ins = inputsOf(x.src);
    return `<ul class="tree">${ins.map(i => `<li><span class="node"><span class="lc">${lotLink(i.lot)}</span><span class="it">${esc(short(LOTS[i.lot].item))}</span><span class="q">${qi(i.qty, LOTS[i.lot].item)}</span>
      <span class="via">${LOTS[i.lot].src ? `from job ${jobLink(LOTS[i.lot].src)}` : esc(LOTS[i.lot].sref)}</span></span>${back(i.lot, depth + 1, seen)}</li>`).join("")}</ul>`;
  };
  const fwd = (code, depth, seen) => {
    if (depth > 4 || seen.has(code)) return ""; seen.add(code);
    const u = usesOf(code); const items = [];
    u.orders.forEach(o => items.push(`<li><span class="node"><span class="lc">${soLink(o.no)}</span><span class="it">${esc(D.orders.find(x => x.no === o.no).customer)}</span><span class="q">${qi(o.qty, LOTS[code].item)}</span><span class="via">dispatched</span></span></li>`));
    u.jobs.forEach(jj => {
      const outs = Object.keys(LOTS).filter(l => LOTS[l].src === jj.job);
      items.push(`<li><span class="node"><span class="lc">Job ${jobLink(jj.job)}</span><span class="it">${esc(short(J[jj.job].item))}</span><span class="q">used ${qi(jj.qty, LOTS[code].item)}</span></span>
        ${outs.length ? `<ul class="tree">${outs.map(o => `<li><span class="node"><span class="lc">${lotLink(o)}</span><span class="it">${esc(short(LOTS[o].item))}</span><span class="via">made</span></span>${fwd(o, depth + 1, seen)}</li>`).join("")}</ul>` : ""}</li>`);
    });
    return items.length ? `<ul class="tree">${items.join("")}</ul>` : "";
  };
  const whereNow = lotRows.filter(r => r.lot === lot && r.qty > 1e-6);
  const b = back(lot, 0, new Set()), f = fwd(lot, 0, new Set());
  return head(`Lot ${esc(lot)}`, `${esc(I[L.item].name)}, ${L.src ? `made on job ${jobLink(L.src)}` : `received ${fDay(L.created)} (${esc(L.sref)})`}.`, `<a href="#/trace">Traceability</a> / ${esc(lot)}`, pick) + `
  <div class="grid g-2e">
    <section class="panel"><div class="ph"><h2>Made from</h2><span class="aside">Back to supplier batches</span></div><div class="pb">
      <ul class="tree"><li><span class="node root"><span class="lc">${esc(lot)}</span><span class="it">${esc(short(L.item))}</span></span>${b || `<p class="muted small" style="margin:10px 0 0">Bought in: ${esc(L.sref || "no supplier reference")}.</p>`}</li></ul></div></section>
    <section class="panel"><div class="ph"><h2>Went to</h2><span class="aside">Jobs and customers</span></div><div class="pb">
      <ul class="tree"><li><span class="node root"><span class="lc">${esc(lot)}</span><span class="it">${esc(short(L.item))}</span></span>${f || `<p class="muted small" style="margin:10px 0 0">Not used or dispatched yet.</p>`}</li></ul>
      <dl class="kv" style="margin-top:16px"><dt>Still in stock</dt><dd>${whereNow.length ? whereNow.map(r => `${qi(r.qty, L.item)} in ${LOCS[r.loc]}`).join(", ") : "None"}</dd></dl></div></section>
  </div>`;
}

// ---------- dies ----------
function vDies() {
  const rows = Object.values(DS).sort((a, b) => b.runs - a.runs);
  return head("Dies", `Runs since each die was last polished. The polish point is set at ${POLISH_AT} runs.`) + `
  <section class="panel"><div class="scroll"><table class="tbl"><thead><tr><th>Die</th><th>Profile</th><th style="min-width:210px">Runs since polish</th><th>Last polished</th><th>Last ran</th><th>Next job</th><th></th></tr></thead><tbody>
  ${rows.map(d => {
    const cls = d.runs >= POLISH_AT ? "bad" : d.runs >= POLISH_AT - 5 ? "warn" : "";
    const cells = Array.from({ length: 42 }, (_, i) => `<i class="${i < d.runs ? "on " + cls : ""}${i === POLISH_AT ? " gap" : ""}"></i>`).join("");
    return `<tr class="go" data-toggle="die-${d.code}"><td class="id"><b>${d.code}</b></td><td>${esc(DIES[d.code].name)}</td>
      <td><div class="prog"><div class="meter" aria-hidden="true">${cells}</div><span><b style="color:${cls === "bad" ? "var(--brick)" : "var(--ink)"}">${d.runs}</b> of ${POLISH_AT}</span></div></td>
      <td>${d.lastPolish ? fDay(d.lastPolish.at) : "–"}</td><td>${d.lastRun ? fDay(d.lastRun.at) : "–"}</td>
      <td>${d.next ? `${jobLink(d.next.no)} <span class="muted small">${fDay(d.next.start)}</span>` : `<span class="muted">None planned</span>`}</td>
      <td>${cls === "bad" && d.next ? `<span class="chip bad">Polish before next job</span>` : cls === "warn" ? `<span class="chip warn">Polish soon</span>` : ""}</td></tr>
      <tr id="die-${d.code}" hidden><td colspan="7" style="background:var(--sunk)"><ul class="timeline">${[...d.events].reverse().slice(0, 8).map(e => `<li><span class="t">${fDay(e.at)}</span><span class="dot ${e.ev === "polish" || e.ev === "repair" ? "die" : ""}"></span><span>${dieText(e)}${e.job ? ` for job ${jobLink(e.job)}` : ""}</span><span></span></li>`).join("")}</ul></td></tr>`;
  }).join("")}
  </tbody></table></div></section>`;
}

// ---------- ledger ----------
let ledgerLimit = 60, ledgerType = "", ledgerItem = "", ledgerText = "";
const TYPES = { receipt: "Receipt", issue: "Issue", output: "Output", scrap: "Scrap", regrind_return: "Regrind return", transfer_out: "Transfer out", transfer_in: "Transfer in", dispatch: "Dispatch", adjustment: "Adjustment", reversal: "Reversal" };
function vLedger() {
  const rows = [...D.mv].filter(m => m.rec <= D.now).sort((a, b) => b.id - a.id)
    .filter(m => (!ledgerType || m.t === ledgerType) && (!ledgerItem || m.item === ledgerItem) &&
      (!ledgerText || [m.lot, m.job, m.ref, m.note, m.so && m.so[0], "#" + m.id].join(" ").toLowerCase().includes(ledgerText.toLowerCase())));
  const tools = `<div class="tools no-print">
    <select id="lt" aria-label="Type"><option value="">All types</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${ledgerType === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    <select id="li" aria-label="Item"><option value="">All items</option>${Object.keys(I).map(c => `<option value="${c}" ${ledgerItem === c ? "selected" : ""}>${esc(short(c))}</option>`).join("")}</select>
    <input id="lx" placeholder="Lot, job, reference" value="${esc(ledgerText)}" aria-label="Search the ledger"></div>`;
  return head("Ledger", "Every stock movement in the order it was entered. Entries are never edited or deleted: mistakes are put right with a reversing entry, so the history always adds up.", "", tools) + `
  <section class="panel"><div class="scroll"><table class="tbl dense nw"><thead><tr><th>#</th><th>Entered</th><th>Type</th><th>Item</th><th>Lot</th><th>Where</th><th class="num">Quantity</th><th>Job or order</th><th>Reference</th></tr></thead><tbody>
  ${rows.slice(0, ledgerLimit).map(m => {
    const rv = reversedBy[m.id], late = lateBy(m) > 60;
    return `<tr><td class="muted">${m.id}</td><td>${fWhen(m.rec)}${late ? `<span class="two" style="color:var(--gorse-ink)">happened ${fWhen(m.occ)}</span>` : ""}</td>
      <td>${TYPES[m.t]}${m.t === "reversal" ? ` <span class="chip">of #${m.rev}</span>` : ""}${rv ? ` <span class="chip warn">reversed by #${rv}</span>` : ""}</td>
      <td>${esc(short(m.item))}</td><td>${lotLink(m.lot)}</td><td>${LOCN[m.loc]}</td>
      <td class="num ${rv ? "struck" : m.qty > 0 ? "pos" : "neg"}">${m.qty > 0 ? "+" : "−"}${qi(Math.abs(m.qty), m.item)}</td>
      <td>${m.job ? jobLink(m.job) : m.so ? soLink(m.so[0]) : ""}</td><td class="muted small wrap">${esc([m.ref, m.note].filter(Boolean).join("; "))}</td></tr>`;
  }).join("") || `<tr><td colspan="9"><div class="empty"><b>No entries match</b>Clear a filter to see more.</div></td></tr>`}
  </tbody></table></div>${rows.length > ledgerLimit ? `<button class="more no-print" id="lmore">Show ${Math.min(60, rows.length - ledgerLimit)} more of ${rows.length - ledgerLimit} remaining</button>` : ""}</section>`;
}

function notFound(what, v) { return `<section class="panel"><div class="empty"><b>No ${what} called ${esc(v)}</b>Check the code, or use the search box at the top.</div></section>`; }

// ---------- shell, routing ----------
function shell() {
  $("#app").innerHTML = `
  <aside class="rail" aria-label="Main">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#E0A21B"/><path fill="#17202A" fill-rule="evenodd" d="M6 9h20v14H6z M9 12v8h6v-8z M17 12v8h6v-8z"/></svg>
      <div><b>Brackwater Extrusions</b><span>Production system</span></div></div>
    <nav class="nav" id="nav">${NAV.map(([k, l]) => `<a href="#/${k}" data-k="${k}">${ICON[k]}<span>${l}</span>${k === "overview" && ATT.length ? `<span class="count" aria-label="${ATT.length} need attention">${ATT.length}</span>` : ""}</a>`).join("")}</nav>
    <div class="rail-foot"><strong>Demonstration data</strong>A fictional two-line extruder, frozen at ${fWhen(D.now)}.<br><br>Built by <a href="https://manninsystems.co.uk" target="_blank" rel="noopener">Mannin Systems</a></div>
  </aside>
  <main>
    <div class="top"><div class="clock"><b>${fDay(D.now)}, ${fTime(D.now)}</b><span>Shift 1 running</span></div>
      <form class="search no-print" id="search" role="search">${ICON.search}<input id="q" list="qlist" placeholder="Find a job, order, lot or die" aria-label="Find a job, order, lot or die" autocomplete="off">
      <datalist id="qlist">${[...D.jobs.map(j => j.no), ...D.orders.map(o => o.no), ...Object.keys(LOTS), ...Object.keys(DIES)].map(v => `<option value="${v}">`).join("")}</datalist><div id="smsg"></div></form></div>
    <div class="page" id="page"></div>
  </main>`;
  $("#search").addEventListener("submit", e => {
    e.preventDefault(); const v = $("#q").value.trim().toUpperCase(); if (!v) return;
    const to = J[v] ? `#/jobs/${v}` : D.orders.some(o => o.no === v) ? `#/orders/${v}` : LOTS[v] ? `#/trace/${v}` : DIES[v] ? "#/dies" :
      J[v.replace(/\D/g, "")] ? `#/jobs/${v.replace(/\D/g, "")}` : null;
    if (to) { $("#q").value = ""; $("#smsg").innerHTML = ""; location.hash = to; }
    else { $("#smsg").innerHTML = `<div class="search-msg">Nothing matches "${esc(v)}". Try a job number like 1037, an order like SO-2623 or a lot like FG-1025.</div>`; setTimeout(() => $("#smsg").innerHTML = "", 4000); }
  });
}
function route() {
  const parts = (location.hash || "#/overview").slice(2).split("/").map(decodeURIComponent);
  const [k, a] = parts; let html = "", key = k || "overview";
  switch (key) {
    case "orders": html = a ? vOrder(a) : vOrders(); break;
    case "jobs": html = a ? vJob(a) : vJobs(); break;
    case "stock": html = vStock(a || "hand"); break;
    case "trace": html = vTrace(a); break;
    case "dies": html = vDies(); break;
    case "ledger": html = vLedger(); break;
    default: key = "overview"; html = vOverview();
  }
  $("#page").innerHTML = html;
  document.querySelectorAll("#nav a").forEach(n => n.setAttribute("aria-current", n.dataset.k === key ? "page" : "false"));
  document.title = (a ? a + " | " : "") + (NAV.find(n => n[0] === key) || ["", "Overview"])[1] + " | Brackwater Extrusions";
  bind();
}
function rerender(keepScroll = true) { const y = window.scrollY; route(); if (keepScroll) window.scrollTo(0, y); }
function bind() {
  document.querySelectorAll("tr[data-href]").forEach(r => r.addEventListener("click", e => { if (e.target.closest("a")) return; location.hash = r.dataset.href; }));
  document.querySelectorAll("[data-wk]").forEach(b => b.addEventListener("click", () => { boardOffset = +b.dataset.wk; rerender(); }));
  document.querySelectorAll("[data-of]").forEach(b => b.addEventListener("click", () => { orderFilter = b.dataset.of; rerender(); }));
  document.querySelectorAll("[data-jf]").forEach(b => b.addEventListener("click", () => { jobFilter = b.dataset.jf; rerender(); }));
  document.querySelectorAll("[data-toggle]").forEach(r => r.addEventListener("click", e => { if (e.target.closest("a")) return; const t = document.getElementById(r.dataset.toggle); t.hidden = !t.hidden; }));
  const tf = $("#traceform"); if (tf) tf.addEventListener("submit", e => { e.preventDefault(); const v = tf.lot.value.trim().toUpperCase(); location.hash = "#/trace/" + encodeURIComponent(v); });
  const lt = $("#lt"), li = $("#li"), lx = $("#lx"), lm = $("#lmore");
  if (lt) lt.addEventListener("change", () => { ledgerType = lt.value; ledgerLimit = 60; rerender(); });
  if (li) li.addEventListener("change", () => { ledgerItem = li.value; ledgerLimit = 60; rerender(); });
  if (lx) lx.addEventListener("change", () => { ledgerText = lx.value.trim(); ledgerLimit = 60; rerender(); });
  if (lm) lm.addEventListener("click", () => { ledgerLimit += 60; rerender(); });
}
shell();
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
route();
})();

</script>
</body>
</html>
